<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LLM Derby card</title>
<style>
  :root {
    --night: #1c0f33; --night-2: #2c1650; --tent-red: #d62839;
    --cream: #fff6e2; --gold: #f6c343; --turf-1: #2f9e44; --turf-2: #37b24d;
    --font: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --u: 1px; /* scale unit, set from JS */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--cream);
    background:
      radial-gradient(circle at 15% 10%, rgba(246,195,67,.22), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(214,40,57,.32), transparent 45%),
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.5px) 0 0 / calc(22 * var(--u)) calc(22 * var(--u)),
      linear-gradient(180deg, var(--night-2), var(--night));
    display: grid; place-items: center;
  }
  /* striped tent awning along the top, like the app */
  .awning {
    position: fixed; top: 0; left: 0; right: 0; height: calc(40 * var(--u));
    background: repeating-linear-gradient(90deg, var(--tent-red) 0 calc(40 * var(--u)), var(--cream) calc(40 * var(--u)) calc(80 * var(--u)));
    -webkit-mask: radial-gradient(circle calc(20 * var(--u)) at calc(20 * var(--u)) 0, #000 98%, transparent) 0 calc(20 * var(--u)) / calc(40 * var(--u)) calc(20 * var(--u)) repeat-x,
                  linear-gradient(#000, #000) 0 0 / 100% calc(20 * var(--u)) no-repeat;
  }
  .stack { display: grid; justify-items: center; gap: calc(26 * var(--u)); text-align: center; padding: 0 calc(60 * var(--u)); }
  .marquee {
    padding: calc(14 * var(--u)) calc(46 * var(--u)) calc(16 * var(--u));
    border: calc(9 * var(--u)) dotted #ffe08a;
    border-radius: calc(30 * var(--u));
    background: linear-gradient(180deg, #7d1225, #4c0b2a);
    box-shadow: 0 0 0 calc(9 * var(--u)) #7d1225, 0 0 calc(70 * var(--u)) rgba(255,210,110,.5);
  }
  .marquee h1 {
    margin: 0; font-weight: 900; font-size: calc(104 * var(--u)); letter-spacing: .02em; line-height: 1.05;
    text-transform: uppercase; color: var(--gold);
    text-shadow: calc(6 * var(--u)) calc(6 * var(--u)) 0 #b3261e, calc(12 * var(--u)) calc(12 * var(--u)) 0 rgba(0,0,0,.35);
  }
  .tag { margin: 0; font-weight: 900; font-size: calc(46 * var(--u)); line-height: 1.2; max-width: calc(1200 * var(--u)); }
  .tag em { font-style: normal; color: var(--gold); }
  .sub { margin: 0; font-weight: 700; font-size: calc(28 * var(--u)); color: rgba(255,246,226,.75); }
  .track {
    width: calc(900 * var(--u)); max-width: 92vw; height: calc(130 * var(--u));
    border-radius: calc(18 * var(--u));
    background: repeating-linear-gradient(90deg, var(--turf-1) 0 calc(60 * var(--u)), var(--turf-2) calc(60 * var(--u)) calc(120 * var(--u)));
    border: calc(5 * var(--u)) solid #fff; position: relative;
    display: flex; align-items: flex-end; justify-content: space-evenly; padding-bottom: calc(6 * var(--u));
    box-shadow: 0 calc(14 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,.4);
  }
  .track::after { /* checkered finish line */
    content: ''; position: absolute; right: calc(28 * var(--u)); top: 0; bottom: 0; width: calc(16 * var(--u));
    background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / calc(16 * var(--u)) calc(16 * var(--u));
  }
  .track svg { width: calc(170 * var(--u)); height: auto; overflow: visible; }
  .url {
    font-weight: 900; font-size: calc(64 * var(--u)); color: var(--night);
    background: var(--gold); padding: calc(14 * var(--u)) calc(40 * var(--u)); border-radius: 999px;
    box-shadow: calc(6 * var(--u)) calc(6 * var(--u)) 0 #b3261e;
  }
  .pills { display: flex; flex-wrap: wrap; gap: calc(14 * var(--u)); justify-content: center; }
  .pill {
    font-weight: 800; font-size: calc(26 * var(--u)); padding: calc(8 * var(--u)) calc(22 * var(--u));
    border-radius: 999px; border: calc(3 * var(--u)) solid rgba(255,224,138,.6); background: rgba(0,0,0,.25);
  }
  .vs { display: flex; align-items: center; gap: calc(16 * var(--u)); flex-wrap: wrap; justify-content: center; }
  .vs .m { font-weight: 900; font-size: calc(32 * var(--u)); padding: calc(8 * var(--u)) calc(22 * var(--u)); border-radius: 999px; background: var(--c); color: #fff; box-shadow: 0 calc(4 * var(--u)) 0 rgba(0,0,0,.35); }
  .vs .m.light { color: var(--night); }
  .vs .x { font-weight: 900; font-size: calc(26 * var(--u)); color: var(--gold); }
  /* Shorts frame: header on top, CTA below the video slot */
  .short-top { position: fixed; top: calc(120 * var(--u)); left: 0; right: 0; display: grid; justify-items: center; gap: calc(26 * var(--u)); text-align: center; padding: 0 calc(40 * var(--u)); }
  .short-bottom { position: fixed; top: calc(1330 * var(--u)); left: 0; right: 0; display: grid; justify-items: center; gap: calc(22 * var(--u)); text-align: center; }
  .short-top .marquee h1 { font-size: calc(96 * var(--u)); }
  .short-top .tag { font-size: calc(40 * var(--u)); }
  .short-top .vs .m { font-size: calc(30 * var(--u)); }
  .short-bottom .url { font-size: calc(52 * var(--u)); }
  .short-bottom .pill { font-size: calc(28 * var(--u)); }
  /* Vertical thumbnail (Shorts): one turf lane per model */
  .vthumb { display: grid; justify-items: center; gap: calc(44 * var(--u)); width: calc(960 * var(--u)); }
  .vthumb .marquee h1 { font-size: calc(132 * var(--u)); }
  .vthumb .hook { margin: 0; font-weight: 900; font-size: calc(96 * var(--u)); line-height: 1.05; color: var(--gold); text-shadow: calc(5 * var(--u)) calc(5 * var(--u)) 0 #b3261e; }
  .vthumb .lanes { display: grid; gap: calc(14 * var(--u)); width: 100%; }
  .vthumb .lane {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    height: calc(160 * var(--u)); padding: 0 calc(70 * var(--u)) 0 calc(24 * var(--u));
    border: calc(5 * var(--u)) solid #fff; border-radius: calc(18 * var(--u));
    background: repeating-linear-gradient(90deg, var(--turf-1) 0 calc(60 * var(--u)), var(--turf-2) calc(60 * var(--u)) calc(120 * var(--u)));
    box-shadow: 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(0,0,0,.35);
  }
  .vthumb .lane::after { content: ''; position: absolute; right: calc(24 * var(--u)); top: 0; bottom: 0; width: calc(18 * var(--u));
    background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / calc(18 * var(--u)) calc(18 * var(--u)); }
  .vthumb .lane .m { font-weight: 900; font-size: calc(46 * var(--u)); padding: calc(10 * var(--u)) calc(28 * var(--u)); border-radius: 999px;
    background: var(--c); color: #fff; box-shadow: 0 calc(5 * var(--u)) 0 rgba(0,0,0,.35); white-space: nowrap; }
  .vthumb .lane .m.light { color: var(--night); }
  .vthumb .lane svg { width: calc(190 * var(--u)); height: auto; overflow: visible; }
  .vthumb .sub { font-size: calc(40 * var(--u)); }
  .small { margin: 0; font-weight: 700; font-size: calc(26 * var(--u)); color: rgba(255,246,226,.7); }

  /* horse sprite colors, same as the app */
  svg .coat, svg .leg rect:not(.hoof) { fill: var(--coat); }
  svg .leg:not(.near) rect:not(.hoof) { filter: brightness(.72); }
  svg .mane, svg .tail { fill: var(--mane); }
  svg .hoof, svg .boot { fill: #1d1714; }
  svg .eye, svg .nostril { fill: #120d0a; }
  svg .silk { fill: var(--silk); }
  svg .sleeve { filter: brightness(.85); }
  svg .cloth { stroke: #fff; stroke-width: 1.4; }
  svg .num { fill: #fff; font: 900 10px var(--font); }
  svg .breeches { fill: #fafafa; }
  svg .skin { fill: #f1c7a1; }
  svg .rein { stroke: #3a2a1c; stroke-width: 1.2; fill: none; }
</style>
</head>
<body>
<div class="awning"></div>
<div class="stack" id="stack"></div>
<script>
  const HORSE = `
<path class="tail" d="M30 40 Q14 40 9 60 Q13 54 19 52 Q15 60 17 66 Q22 52 32 47 Z"/>
<g class="leg leg-b2"><rect x="38" y="48" width="6" height="26" rx="3"/><rect class="hoof" x="37" y="71" width="8" height="4" rx="1.5"/></g>
<g class="leg leg-f2"><rect x="74" y="48" width="6" height="26" rx="3"/><rect class="hoof" x="73" y="71" width="8" height="4" rx="1.5"/></g>
<path class="coat" d="M84 18 L96 22 L84 50 L70 44 Z"/>
<ellipse class="coat" cx="56" cy="44" rx="29" ry="13"/>
<g class="leg leg-b1 near"><rect x="32" y="49" width="6.5" height="26" rx="3"/><rect class="hoof" x="31" y="72" width="8.5" height="4" rx="1.5"/></g>
<g class="leg leg-f1 near"><rect x="78" y="49" width="6.5" height="26" rx="3"/><rect class="hoof" x="77" y="72" width="8.5" height="4" rx="1.5"/></g>
<ellipse class="coat" cx="99" cy="25" rx="13" ry="6.5" transform="rotate(32 99 25)"/>
<path class="mane" d="M83 16 Q76 28 70 42 L75 43 Q80 31 89 19 Z"/>
<path class="coat" d="M88 15 L90 6 L94 16 Z"/>
<circle class="eye" cx="95" cy="21" r="1.6"/>
<circle class="nostril" cx="107" cy="31" r="1.1"/>
<rect class="silk cloth" x="44" y="35" width="18" height="14" rx="2.5"/>
<text class="num" x="53" y="46" text-anchor="middle">#</text>
<path class="breeches" d="M58 34 L66 33 L64 46 L59 46 Z"/>
<rect class="boot" x="58" y="43" width="7" height="6" rx="2"/>
<path class="silk" d="M54 34 L66 19 L75 23 L64 37 Z"/>
<path class="silk sleeve" d="M70 22 L84 28 L83 31 L68 27 Z"/>
<circle class="skin" cx="76" cy="15" r="5"/>
<path class="silk cap" d="M70.5 14 A5.6 5.6 0 0 1 81.6 13.5 L85 15 L70.5 15 Z"/>
<path class="rein" d="M83 30 L98 27"/>`;
  const LANES = [
    { color: '#e63946', coat: '#9a5530', mane: '#4a2512' },
    { color: '#1e6fd9', coat: '#4b3426', mane: '#1f140d' },
    { color: '#f2b705', coat: '#d9d2c5', mane: '#8c8274' },
    { color: '#8e44ad', coat: '#2b2522', mane: '#0d0b0a' },
  ];
  const horse = (i) =>
    `<svg viewBox="0 0 118 80" style="--coat:${LANES[i].coat};--mane:${LANES[i].mane};--silk:${LANES[i].color}">${HORSE.replace('>#<', `>${i + 1}<`)}</svg>`;
  

  const p = new URLSearchParams(location.search);
  // ?m=Model A|Model B|Model C  -> "A vs B vs C" chips in lane colors, plus optional ?fmt=Best of 3
  const models = (p.get('m') || '').split('|').filter(Boolean);
  const matchup = models.length ? `<div class="vs">${models.map((name, i) =>
      `<span class="m${i === 2 ? ' light' : ''}" style="--c:${LANES[i].color}">${name}</span>`).join('<span class="x">vs</span>')}</div>
      ${p.get('fmt') ? `<p class="sub">${p.get('fmt')}</p>` : ''}` : '';
  // Scale everything off a 1548x1080 design; narrower frames shrink to fit.
  const w = innerWidth, h = innerHeight;
  const track = `<div class="track">${[...Array(Math.max(3, models.length)).keys()].map(horse).join('')}</div>`;
  document.documentElement.style.setProperty('--u', (p.get('u') ? +p.get('u') : Math.min(w / 1548, h / 1080)) + 'px');

  const CARDS = {
    intro: `
      <div class="marquee"><h1>LLM Derby</h1></div>
      <p class="tag">LLMs race head&#8209;to&#8209;head answering trivia.<br><em>First to 20 correct wins.</em></p>
      ${track}
      ${matchup}`,
    short: `
      </div><div class="short-top">
        <div class="marquee"><h1>LLM Derby</h1></div>
        <p class="tag">LLMs race answering trivia.<br><em>First to 20 correct wins.</em></p>
        ${matchup}
      </div>
      <div class="short-bottom">
        <div class="url">sujee.github.io/llm-derby</div>
        <span class="pill">🧪 Simulator mode (no API keys needed)</span>
      </div><div>`,
    thumbv: `
      <div class="vthumb">
        <div class="marquee"><h1>LLM Derby</h1></div>
        <p class="hook">Which LLM wins?</p>
        <div class="lanes">${models.map((name, i) => `<div class="lane"><span class="m${i === 2 ? ' light' : ''}" style="--c:${LANES[i].color}">${name}</span>${horse(i)}</div>`).join('')}</div>
        ${p.get('fmt') ? `<p class="sub">${p.get('fmt')}</p>` : ''}
      </div>`,
    bg: '<style>.awning{display:none}</style>',
    end: `
      <div class="marquee"><h1>LLM Derby</h1></div>
      <p class="tag">Race your own models</p>
      <div class="url">sujee.github.io/llm-derby</div>
      <div class="pills">
        <span class="pill">🌐 Runs in your browser</span>
        <span class="pill">🔑 Keys never leave it</span>
        <span class="pill">🧪 Simulator mode (no API keys needed)</span>
      </div>
      <p class="small">Open source (MIT) · github.com/sujee/llm-derby</p>`,
  };
  document.getElementById('stack').innerHTML = CARDS[p.get('card') || 'intro'];
</script>
</body>
</html>
